tput is predictable</text><path d='M360.0 364 V386' stroke='#a78bfa' stroke-width='3'/><path d='M352.0 382 L360.0 393 L368.0 382 Z' fill='#a78bfa'/><rect x='40' y='398' width='640' height='69' rx='13' fill='#182042' stroke='#5eead4' stroke-width='1.5'/><text x='360.0' y='426' font-family='Inter,system-ui,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#eef1fb' text-anchor='middle'>Secure Output</text><text x='360.0' y='450' font-family='Inter,system-ui,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a7b0cf' text-anchor='middle'>If the scoop is good, output is uniform</text><text x='360.0' y='489' font-family='Inter,system-ui,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a7b0cf' text-anchor='middle'>How a bad seed can compromise randomness extraction</text></svg>